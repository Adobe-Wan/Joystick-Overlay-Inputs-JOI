<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay On Target</title>
<style>
:root {
  --ui-accent: #4fd1ff;
  --guide: #ff3fb4;
  --panel: #0d131b;
  --line: rgba(255, 255, 255, 0.12);
  --text: #e8f1f8;
  --muted: #8a9aab;
  --hot: #ff5d73;
  --font: "Segoe UI", "Inter", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "SF Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: transparent; color: var(--text); font-family: var(--font);
  -webkit-font-smoothing: antialiased; user-select: none;
}
body.editing { background-color: #11161d; background-size: cover; background-position: center; }
body.bg-solid:not(.editing) { background: var(--bgcolor, #00ff00); }
/* Opened in a normal browser (not OBS): dark preview instead of a blank white page. */
body.preview:not(.editing):not(.bg-solid) { background: #0b1016; }
#preview-chip { position: fixed; left: 1rem; bottom: 1rem; z-index: 10; display: none; align-items: center; gap: 0.6rem; padding: 0.5rem 0.9rem; font: 500 0.93rem/1.4 var(--font); color: #b6c3d1; max-width: calc(100vw - 2rem); flex-wrap: wrap; }
body.preview:not(.editing).has-widgets #preview-chip { display: flex; }
#preview-chip .warn { color: #ffb547; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* ---------- widgets ---------- */
.widget {
  --accent: #ffffff; --wtext: #ffffff; --wbg: #121212;
  position: absolute; padding: 8px; text-align: center;
  background: var(--wbg); color: var(--wtext);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
}
.widget .title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 7px; white-space: nowrap;
}
.widget.offline { opacity: 0.45; }
.widget.offline .title::after { content: " · not connected"; color: var(--hot); letter-spacing: 0.04em; text-transform: none; }
.widget canvas { display: block; margin: 0 auto; }
.readout {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600;
  display: flex; justify-content: center; gap: 14px; margin-top: 7px; white-space: nowrap;
}
.readout b { opacity: 0.7; font-weight: 500; margin-right: 5px; font-family: var(--font); font-size: 11px; letter-spacing: 0.08em; }
.readout .full { color: var(--accent); }
/* Each value reserves room for its widest reading ("+100%"), so widgets never change size as inputs move. */
.readout .val { display: inline-block; min-width: 5ch; text-align: left; }
/* Pedals with axis labels off: L | rudder | R. 0% sits dead center; positive readings grow to the right
   from the "0" position, negative ones to the left, so the number tracks the rudder's direction. */
.readout.ped-split { display: grid; grid-template-columns: 1fr 9ch 1fr; gap: 6px; }
.ped-split > .bl { grid-column: 1; justify-self: start; }
.ped-split > .rud { grid-column: 2; position: relative; height: 1.3em; }
.ped-split > .br { grid-column: 3; justify-self: end; text-align: right; }
.ped-split > .br .val { text-align: right; }
.ped-split .rud .val { position: absolute; top: 0; left: 50%; min-width: 0; transform: translateX(-50%); }
.ped-split .rud .val.pos { transform: translateX(-1ch); }
.ped-split .rud .val.neg { transform: translateX(calc(-100% + 1ch)); }
.bars { display: flex; gap: 14px; align-items: flex-end; justify-content: center; }
.bars .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bars .col span { font-size: 10px; letter-spacing: 0.1em; opacity: 0.75; text-transform: uppercase; }
.btn-widget { padding: 8px 14px; min-width: 64px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; transition: background 60ms, color 60ms, box-shadow 60ms; }
.btn-widget.on { background: var(--accent); color: var(--on, #031018); border-color: var(--accent); box-shadow: 0 0 14px var(--accent); text-shadow: none; }
.label-widget { font-weight: 700; letter-spacing: 0.06em; }
/* Perspective: one GPU-composited CSS transform per widget, no per-frame cost. */
.widget.tilted { transform-origin: 50% 50%; will-change: transform; backface-visibility: hidden; }

/* ---------- edit mode: guides, selection ---------- */
#grid, #center-lines, #guides { position: absolute; left: 0; top: 0; pointer-events: none; display: none; }
body.editing #grid, body.editing #guides { display: block; }
body.editing.show-center #center-lines { display: block; }
#center-lines i, #guides i { position: absolute; display: block; }
#center-lines i { background: rgba(79, 209, 255, 0.6); }
#center-lines i.v { width: 1px; top: 0; bottom: 0; }
#center-lines i.h { height: 1px; left: 0; right: 0; }
#guides i { background: var(--guide); box-shadow: 0 0 4px var(--guide); }
#center-lines, #guides { z-index: 5; width: 100%; height: 100%; }
#marquee { position: fixed; display: none; border: 1px solid var(--ui-accent); background: rgba(79,209,255,0.12); pointer-events: none; z-index: 15; }
body.editing .widget { cursor: move; }
body.editing .widget:hover { outline: 1px solid rgba(79,209,255,0.45); }
body.editing .widget.selected { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

/* ---------- editor UI (MUI dark-theme conventions, rem-based so it scales for 4K) ---------- */
html { font-size: 14px; }   /* set from JS: grows with the viewport so 4K stays readable */
#ui, #welcome, #wizard, #confirm, #enter-edit, #toast { font-family: var(--font); }
#ui { display: none; }
body.editing #ui { display: block; }
body.panel-hidden #panel { display: none; }
body.panel-hidden #toolbar { left: 50%; max-width: calc(100vw - 1.5rem); }
.paper {
  background: #121a24; color: var(--text); border: 1px solid rgba(255,255,255,0.12); border-radius: 0.5rem;
  box-shadow: 0 0.6rem 1.2rem -0.4rem rgba(0,0,0,0.6), 0 1.6rem 2.4rem 0.2rem rgba(0,0,0,0.3);
}
#toolbar {
  position: fixed; top: 0.75rem; left: calc(50% - 11.5rem); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
  flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 25rem);
}
#toolbar .divider { width: 1px; align-self: stretch; background: rgba(255,255,255,0.12); margin: 0 0.25rem; }
button, select, input[type=text], input[type=number] {
  font: 500 1rem/1.4 var(--font); color: var(--text); background: transparent;
  border: 1px solid rgba(255,255,255,0.23); border-radius: 0.3rem; padding: 0.4rem 0.9rem; min-height: 2.5rem;
}
select, input[type=text], input[type=number] { background: rgba(255,255,255,0.06); }
/* Native dropdown lists: dark menu with light text. Without this, Windows draws the open list
   white while the options inherit our light text color, which is unreadable. */
#ui, #wizard { color-scheme: dark; }
select { background-color: #1b2632; }
select option, select optgroup { background-color: #121a24; color: #e8f1f8; }
select option:checked { background-color: #2a3d52; color: #ffffff; }
button { cursor: pointer; letter-spacing: 0.02em; transition: background 120ms, border-color 120ms; }
button:hover { background: rgba(79,209,255,0.08); border-color: var(--ui-accent); }
button.primary { background: var(--ui-accent); color: #00131c; border-color: var(--ui-accent); font-weight: 650;
  box-shadow: 0 0.2rem 0.1rem -0.1rem rgba(0,0,0,0.2), 0 0.15rem 0.15rem rgba(0,0,0,0.14); }
button.primary:hover { background: #7fdfff; }
button.text { border-color: transparent; color: var(--ui-accent); }
button.on { border-color: var(--ui-accent); color: var(--ui-accent); }
button.danger:hover { border-color: var(--hot); color: var(--hot); background: rgba(255,93,115,0.08); }
button:focus-visible, select:focus-visible, input:focus-visible, .switch:focus-within {
  outline: 0.2rem solid #ffd34d; outline-offset: 0.15rem;   /* WCAG 2.4.7 visible focus */
}
/* Color picker: a swatch button that opens a popover (saturation/brightness area, hue slider, hex, presets). */
.dev-row { display: grid; gap: 0.15rem; padding: 0.55rem 0.7rem; margin: 0 0 0.45rem; border: 1px solid rgba(255,255,255,0.14); border-radius: 0.4rem; }
.dev-row small { color: #a9b6c4; font-size: 0.85rem; }
.dev-row.hot { border-color: var(--ui-accent); }
.dev-row.missing { border-style: dashed; border-color: rgba(255,181,71,0.6); }
.dev-meter { height: 0.3rem; border-radius: 0.2rem; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 0.25rem; }
.dev-meter i { display: block; height: 100%; background: var(--ui-accent); }
.warn-box { color: #ffd59a !important; border: 1px solid rgba(255,181,71,0.5); background: rgba(255,181,71,0.08); border-radius: 0.4rem; padding: 0.6rem 0.7rem; }
.cpick { display: inline-flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0.7rem 0.3rem 0.35rem; min-width: 8.4rem; background: rgba(255,255,255,0.06); }
.cpick .chip { width: 1.75rem; height: 1.75rem; border-radius: 0.35rem; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 1px 2px rgba(0,0,0,0.4); flex: none; }
.cpick .hex { font: 600 0.92rem/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.cpop { position: fixed; z-index: 70; width: 16rem; padding: 0.8rem; display: grid; gap: 0.7rem; }
.cpop .sv { position: relative; height: 9.5rem; border-radius: 0.4rem; cursor: crosshair; touch-action: none;
  background: linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, rgba(255,255,255,0)), var(--hue); }
.cpop .sv:focus-visible { outline: 0.2rem solid #ffd34d; outline-offset: 0.15rem; }
.cpop .knob { position: absolute; width: 1rem; height: 1rem; margin: -0.5rem 0 0 -0.5rem; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.5); pointer-events: none; }
.cpop input.hue { -webkit-appearance: none; appearance: none; width: 100%; height: 0.8rem; border-radius: 0.4rem; margin: 0.2rem 0;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.cpop input.hue::-webkit-slider-thumb { -webkit-appearance: none; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--hue);
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.5); cursor: pointer; }
.cpop input.hue::-moz-range-thumb { width: 1rem; height: 1rem; border-radius: 50%; background: var(--hue); border: 2px solid #fff; cursor: pointer; }
.cpop .line { display: flex; align-items: center; gap: 0.5rem; }
.cpop .now { width: 2.5rem; height: 2.5rem; border-radius: 0.4rem; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
.cpop .hexin { flex: 1 1 0; width: 0; min-width: 0; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
.cpop .drop { padding: 0.4rem 0.6rem; }
.cpop .presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.35rem; }
.cpop .presets button { min-height: 0; height: 1.6rem; padding: 0; border-radius: 0.3rem; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); }
.cpop .presets button[aria-pressed=true] { outline: 2px solid #fff; outline-offset: 1px; }
input[type=range] { accent-color: var(--ui-accent); width: 11rem; height: 1.6rem; }
input[type=checkbox] { accent-color: var(--ui-accent); width: 1.3rem; height: 1.3rem; }
/* MUI-style switch */
.switch { display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer; font-weight: 600; font-size: 1rem; padding: 0.2rem 0.4rem; border-radius: 0.3rem; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 2.6rem; height: 1.1rem; border-radius: 1rem; background: rgba(255,255,255,0.3); position: relative; transition: background 150ms; }
.switch .thumb { position: absolute; top: 50%; left: -0.1rem; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: #e0e0e0;
  transform: translateY(-50%); transition: left 150ms, background 150ms; box-shadow: 0 0.1rem 0.25rem rgba(0,0,0,0.5); }
.switch input:checked + .track { background: rgba(79,209,255,0.5); }
.switch input:checked + .track .thumb { left: 1.25rem; background: var(--ui-accent); }
#panel {
  position: fixed; top: 0.75rem; right: 0.75rem; bottom: 0.75rem; width: 22rem; z-index: 20; overflow-y: auto; padding: 1.1rem;
  font-size: 1rem;
}
#panel h3 { margin: 0.2rem 0 0.8rem; font-size: 1.3rem; font-weight: 600; }
#panel h4 { margin: 1.4rem 0 0.6rem; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
#panel .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin: 0.5rem 0; }
#panel .row > span { color: #b6c3d1; }
#panel .row select, #panel .row input[type=text], #panel .row input[type=number] { width: 11rem; }
#panel .hint { color: #a9b6c4; line-height: 1.5; margin: 0.6rem 0; }
#panel .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.9rem; }
.icon-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem; }
.icon-row button { padding: 0.4rem 0; display: flex; align-items: center; justify-content: center; }
.icon-row svg { width: 1.4rem; height: 1.4rem; stroke: currentColor; fill: none; stroke-width: 1.6; pointer-events: none; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.4rem 0; }
.theme-tile { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.5rem; text-align: left; font-size: 0.86rem; line-height: 1.25; min-height: 0; font-weight: 600; }
.theme-tile[aria-pressed=true] { border-color: var(--ui-accent); box-shadow: inset 0 0 0 1px var(--ui-accent); }
.theme-prev { display: flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.5rem; border: 1px solid; border-radius: 0.35rem; pointer-events: none; }
.theme-prev .sq { position: relative; flex: none; width: 1.7rem; height: 1.7rem; border: 1px solid; border-radius: 0.15rem; }
.theme-prev .sq i { position: absolute; left: 60%; top: 28%; width: 0.45rem; height: 0.45rem; border-radius: 50%; }
.theme-prev .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.theme-prev b { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.theme-prev .bar { position: relative; height: 0.35rem; border-radius: 0.2rem; overflow: hidden; }
.theme-prev .bar i { position: absolute; left: 50%; top: 0; bottom: 0; width: 32%; }
.swatch { position: relative; flex: none; width: 2.6rem; height: 1.5rem; border: 2px solid; border-radius: 0.25rem; }
.swatch b { position: absolute; left: 0.3rem; top: 50%; width: 1.1rem; height: 2px; margin-top: -1px; }
.swatch i { position: absolute; right: 0.3rem; top: 50%; width: 0.5rem; height: 0.5rem; margin-top: -0.25rem; border-radius: 50%; }
.swatch.empty { border-style: dashed; border-color: rgba(255,255,255,0.35); }
.tsel { position: relative; margin: 0.2rem 0 0.4rem; }
.tsel-btn { width: 100%; display: flex; align-items: center; gap: 0.6rem; text-align: left; padding: 0.4rem 0.6rem; }
.tsel-btn .tsel-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tsel-btn[aria-expanded=true] .chev { transform: rotate(180deg); }
.tsel-list { position: absolute; left: 0; right: 0; top: calc(100% + 0.25rem); z-index: 5; margin: 0; padding: 0.3rem 0; list-style: none;
  max-height: 20rem; overflow-y: auto; background: #121a24; border: 1px solid rgba(255,255,255,0.2); border-radius: 0.4rem; box-shadow: 0 0.6rem 1.4rem rgba(0,0,0,0.6); }
.tsel-list:focus-visible { outline: 0.2rem solid #ffd34d; outline-offset: 0.15rem; }
.tsel-list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.7rem; cursor: pointer; }
.tsel-list li.active { background: rgba(79,209,255,0.14); }
.tsel-list li[aria-selected=true] { color: var(--ui-accent); font-weight: 650; }
.tsel-list li[aria-selected=true]::after { content: "✓"; margin-left: auto; }
.wide-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; margin-top: 0.3rem; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 0.8rem 0; }
.choices button { padding: 1rem 0.6rem; font-size: 1.05rem; font-weight: 600; }
.step { border: 1px solid rgba(255,255,255,0.15); border-radius: 0.5rem; padding: 0.8rem; margin: 0.6rem 0; color: #a9b6c4; }
.step.active { border-color: var(--ui-accent); color: var(--text); }
.step.done { color: var(--text); }
.step.done::before { content: "✓ "; color: var(--ui-accent); }
.step .live { height: 0.45rem; background: rgba(255,255,255,0.1); border-radius: 0.3rem; margin-top: 0.6rem; overflow: hidden; }
.step .live i { display: block; height: 100%; width: 0; background: var(--ui-accent); }
#toast {
  position: fixed; left: 50%; top: 5rem; transform: translateX(-50%); z-index: 40; padding: 0.7rem 1.1rem; font-size: 1rem;
  opacity: 0; transition: opacity 200ms; pointer-events: none;
}
#toast.show { opacity: 1; }
/* First-run dialog */
#welcome { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
#welcome.open { display: flex; }
#confirm { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); color-scheme: dark; }
#confirm.open { display: flex; }
#confirm .dialog { width: min(30rem, calc(100vw - 2rem)); padding: 1.6rem 1.8rem; font-size: 1.07rem; line-height: 1.55; }
#confirm h2 { margin: 0 0 0.5rem; font-size: 1.4rem; font-weight: 600; }
#confirm p { color: #b6c3d1; margin: 0 0 1.3rem; }
#confirm .foot { display: flex; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
#confirm button.danger.solid { background: var(--hot); border-color: var(--hot); color: #1a0508; font-weight: 600; }
#confirm button.danger.solid:hover { filter: brightness(1.1); color: #1a0508; }
#welcome .dialog { width: min(40rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; padding: 1.8rem 2rem; font-size: 1.07rem; line-height: 1.55; }
#welcome h2 { margin: 0 0 0.4rem; font-size: 1.8rem; font-weight: 600; }
#welcome .lead { color: #b6c3d1; margin: 0 0 1.2rem; }
#welcome ol { list-style: none; padding: 0; margin: 0 0 1.2rem; display: grid; gap: 0.7rem; }
#welcome li { display: block; }
#welcome .wstep { width: 100%; display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: 0.8rem; text-align: left;
  padding: 0.8rem 1rem; border: 1px solid rgba(255,255,255,0.14); border-radius: 0.5rem; letter-spacing: normal; line-height: 1.45; }
#welcome .wstep:hover { border-color: var(--ui-accent); background: rgba(79,209,255,0.06); }
#welcome .wstep .go { font-size: 1.6rem; color: #a9b6c4; transition: transform 120ms, color 120ms; }
#welcome .wstep:hover .go, #welcome .wstep:focus-visible .go { color: var(--ui-accent); transform: translateX(0.15rem); }
#welcome li .num { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  background: rgba(79,209,255,0.16); color: var(--ui-accent); }
#welcome li b { display: block; }
#welcome li small { color: #a9b6c4; font-size: 0.93rem; }
#welcome .foot { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; color: #a9b6c4; }
kbd { font: 600 0.9em var(--mono); padding: 0.1em 0.45em; border: 1px solid rgba(255,255,255,0.35); border-bottom-width: 2px; border-radius: 0.3em; background: rgba(255,255,255,0.08); color: #fff; }
/* Setup wizard: walks through each device in the middle of the screen */
#wizard { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); }
#wizard.open { display: flex; }
#wizard.see-through { background: rgba(0,0,0,0.12); }
#wizard .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 0.7rem; margin: 0.4rem 0; }
#wizard .shot { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.45rem; font-weight: 600; }
#wizard .shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 0.3rem; }
#wizard .shot[aria-pressed=true] { border-color: var(--ui-accent); box-shadow: inset 0 0 0 1px var(--ui-accent); color: var(--ui-accent); }
#wizard .dialog { position: relative; width: min(38rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; padding: 1.8rem 2rem; font-size: 1.07rem; line-height: 1.55; }
#wizard .close { position: absolute; top: 0.9rem; right: 0.9rem; min-height: 0; padding: 0.3rem 0.6rem; color: #b6c3d1; }
#wizard .kicker { display: flex; align-items: center; gap: 0.7rem; color: var(--ui-accent); font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
/* Step tracker: earlier steps are buttons you can jump back to. */
#wizard .wsteps { display: flex; flex-wrap: wrap; gap: 0.35rem; list-style: none; padding: 0; margin: 0 0 0.7rem; font-size: 0.85rem; }

const TYPES = {

    { key: "x", ask: "Move the stick fully RIGHT", dir: +1 },
    { key: "y", ask: "Push the stick fully FORWARD", dir: +1 } ] },

let wiz = null;

  const used = w => profile.widgets.filter(x => x.match && devKey(x.match) === w.key && (x.nth || 0) === w.nth).map(x => x.label || x.type);
  const frag = document.createDocumentFragment();
  frag.append(el("h4", {}, `Seen by the browser (${pads.length}${slots ? " of " + slots + " slots" : ""})`));
  if (!pads.length) frag.append(el("div", { class: "hint", style: "color:#ffb547" }, "Nothing yet. Browsers hide controllers until you press a button or move an axis fully after the page opens."));
  for (const d of pads) {
    const act = Math.max(0, ...d.pad.axes.map(a => Math.abs(a))), pressed = d.pad.buttons.some(b => b.pressed);
    const meter = el("span", { class: "dev-meter", "aria-hidden": "true" }, el("i", { style: `width:${Math.round(act * 100)}%` }));
    const by = used(d);
    frag.append(el("div", { class: "dev-row" + (pressed ? " hot" : "") },
      el("b", {}, prettyName(d.id) + (pads.filter(x => x.key === d.key).length > 1 ? ` #${d.nth + 1}` : "")),
      el("small", {}, `Slot ${d.pad.index + 1} · ${d.pad.axes.length} axes · ${d.pad.buttons.length} buttons` + (by.length ? " · used by " + by.join(", ") : " · not used yet")),
      meter));
  }
  const missing = profile.widgets.filter(w => w.match && !padFor(w, pads));
  if (missing.length) {
    frag.append(el("h4", {}, "Waiting for"));
    for (const w of missing) frag.append(el("div", { class: "dev-row missing" }, el("b", {}, w.label || w.type),
      el("small", {}, prettyName(w.match) + (w.nth ? " #" + (w.nth + 1) : "") + (w.type === "pedals" ? " · push a pedal or a toe brake all the way once" : " · press a button or move it all the way once"))));
  }
  if (slots && pads.length >= Math.min(slots, PAD_SLOTS) && missing.length)
    frag.append(el("div", { class: "hint warn-box" }, `All ${pads.length} controller slots are taken, so another device can't get in. Browsers and OBS show at most ${PAD_SLOTS} game controllers at once. Check the list above for devices you don't need on stream (a second throttle, a button box, a virtual controller from Steam, vJoy or a racing wheel), and unplug or disable one in Windows Device Manager, then reopen this page.`));
  frag.append(el("div", { class: "hint" }, "Still missing? Close other browser tabs or apps that read controllers, unplug the device and plug it back in, then refresh. Windows lists every controller under Win+R, joy.cpl."));
  body.replaceChildren(frag);
}
setInterval(() => { if (editing && panelMode === "devices") { const b = $("#dev-body"); if (b) fillDevices(b); } }, 200);

function renderSettingsPanel(p) {
  const s = profile.settings;
  p.append(el("h3", {}, "Settings"));
  p.append(el("h4", {}, "Layout"));
  p.append(row("Center lines", checkIn(s, "centerLines", applySettings)));
  p.append(row("Smart guides", checkIn(s, "smartGuides")));
  p.append(row("Snap to grid", checkIn(s, "gridSnap", applySettings)));
  p.append(row("Grid size", selectIn(s, "gridSize", [[8, "8 px"], [16, "16 px"], [24, "24 px"], [32, "32 px"]], applySettings)));
  p.append(row("Safe margin, px", numIn(s, "margin", 0, 200, 4)));
  p.append(el("h4", {}, "Size"));
  const scaleRow = row("Overlay scale", numIn(s, "scale", 0.3, 4, 0.05, rebuildAll));
  p.append(row("Fit overlay to screen size", checkIn({ get v() { return s.scaleMode === "auto"; }, set v(x) { s.scaleMode = x ? "auto" : "manual"; } }, "v", () => { rebuildAll(); setSelection([], "settings"); })));
  if (s.scaleMode !== "auto") p.append(scaleRow);
  p.append(el("div", { class: "hint" }, "On, a layout made at 1080p keeps the same proportions at 1440p or 4K."));
  p.append(row("Editor text size", selectIn(s, "uiScale", [["auto", "Auto (scales for 4K)"], [1, "100%"], [1.25, "125%"], [1.5, "150%"], [2, "200%"], [2.5, "250%"]], applySettings)));
  themeSection(p, profile.widgets.filter(w => w.type !== "label"), true);
  p.append(el("h4", {}, "Background"));
  p.append(row("Solid background", checkIn({ get v() { return s.background === "solid"; }, set v(x) { s.background = x ? "solid" : "transparent"; } }, "v", applySettings)));
  p.append(row("Background color", colorIn(s, "bgColor", applySettings, "Background color")));
  p.append(el("div", { class: "hint" }, "Leave the background transparent for OBS. A solid color is only for tools without transparency."));
  p.append(el("h4", {}, "Session heatmap"));
  p.append(el("div", { class: "hint" }, "Shows where each stick, throttle and pedal spent its time this session, e.g. which way you strafe most. Toggle with H, reset with R."));
  p.append(el("div", { class: "actions" }, el("button", { onclick: toggleHeat }, showHeat ? "Hide Heatmap" : "Show Heatmap"), el("button", { onclick: resetHeat }, "Reset Heatmap")));
  p.append(el("h4", {}, "About"));
  p.append(el("div", { class: "hint" }, "Stay On Target is free, open-source software under the MIT License. It uses no third-party libraries, fonts, trackers or online services: everything runs offline from this one file."));
  p.append(el("div", { class: "hint" }, "This is an unofficial Star Citizen fan project, not affiliated with the Cloud Imperium group of companies. Star Citizen®, Roberts Space Industries® and Cloud Imperium® are trademarks of Cloud Imperium Rights LLC. Manufacturer names are used only to describe fan-made color themes."));
  p.append(el("h4", {}, "Start Over"));
  p.append(el("div", { class: "actions" }, el("button", { class: "danger", onclick: resetAll }, "Reset All")));
}

function renderExportPanel(p) {
  p.append(el("h3", {}, "Save and share"));
  p.append(el("div", { class: "hint" }, "Your setup saves automatically. For a backup that survives OBS clearing its cache, download profile.js and put it in the same folder as StayOnTarget.html."));
  p.append(el("div", { class: "actions" }, el("button", { class: "primary", onclick: () => exportProfile(true) }, "Download profile.js")));
  p.append(el("h4", {}, "Share with another pilot"));
  p.append(el("div", { class: "hint" }, "Send StayOnTarget.html plus your profile.js. With the same hardware it works straight away; otherwise they remove the widgets and add their own devices."));
  p.append(el("div", { class: "actions" }, el("button", { onclick: () => exportProfile(false) }, "Download .json"), el("button", { onclick: () => $("#file-in").click() }, "Import a Profile")));
}

// ---------- boot ----------
// OBS exposes window.obsstudio; anywhere else we show a dark preview. Add ?transparent to the
// URL for other streaming apps that support transparency but don't identify themselves.
const IN_OBS = !!window.obsstudio || new URLSearchParams(location.search).has("transparent");
document.body.classList.toggle("preview", !IN_OBS);
$("#preview-edit").addEventListener("click", () => setEditing(true));
loadProfile();
rebuildAll();
if (new URLSearchParams(location.search).has("edit")) setEditing(true);
requestAnimationFrame(frame);
// First run (no saved setup and no profile.js): open the editor with the getting-started dialog.
window.addEventListener("load", () => { if (firstRun && !window.STAYONTARGET_PROFILE && !window.JOYVIZ_PROFILE) { setEditing(true); openWelcome(); } });
</script>
<!-- Optional saved profile; ignored if the file doesn't exist. -->
<script src="profile.js"></script>
<script>
const fileProfile = window.STAYONTARGET_PROFILE || window.JOYVIZ_PROFILE;
if (fileProfile && (+fileProfile.savedAt || 0) > (+profile.savedAt || 0)) { profile = normalize(fileProfile); rebuildAll(); }
</script>
</body>
