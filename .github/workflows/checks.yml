# Lint and the Playwright test suite (everything except the @soak test) on every pull request and every push to main.
# Uses the Node.js preinstalled on the runner (ubuntu-latest ships Node 20 or newer), so no setup action is needed.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Node version
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        if: success() || failure()   # run the tests even when lint fails, so one push shows both
        run: npm test
        env:
          CI: "true"
