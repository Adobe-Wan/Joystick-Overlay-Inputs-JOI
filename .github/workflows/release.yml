# Builds StayOnTarget.zip and publishes a GitHub Release.
# Runs when a version tag (v1.0.0, v1.1.0, ...) is pushed, or by hand from the Actions tab
# ("Release" → "Run workflow", type the version), which creates the tag for you.
# The README's download link always points at the newest release's zip.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.1.0"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its files
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Check this is main
        run: |
          # A hand-run release must come from main, so a release can only ship reviewed code.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run the Release workflow from main, not $GITHUB_REF"; exit 1
          fi

      - name: Check version format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3, got '$TAG'"; exit 1; }

      - name: Build StayOnTarget.zip
        run: |
          mkdir -p "dist/Stay On Target"
          cp StayOnTarget.html README.md LICENSE "dist/Stay On Target/"
          if [ -d "Background Images for Edit Mode" ]; then cp -r "Background Images for Edit Mode" "dist/Stay On Target/"; fi
          cp -r docs "dist/Stay On Target/"   # the README's images
          cd dist && zip -r -X StayOnTarget.zip "Stay On Target"
          sha256sum StayOnTarget.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          # A release made by hand on GitHub already exists for this tag: just attach the zip to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/StayOnTarget.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/StayOnTarget.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "Stay On Target $TAG" --generate-notes --latest
          fi
